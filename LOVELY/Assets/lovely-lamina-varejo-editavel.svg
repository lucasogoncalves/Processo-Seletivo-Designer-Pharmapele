<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 794 1123">
<title>Lâmina de varejo LOVELY — A4</title><defs><linearGradient id="shade"><stop stop-color="#5b192c" stop-opacity=".97"/><stop offset=".48" stop-color="#5b192c" stop-opacity=".78"/><stop offset="1" stop-color="#5b192c" stop-opacity=".08"/></linearGradient><linearGradient id="paper"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f6f1e7"/></linearGradient><style>.sans{font-family:Arial}.serif{font-family:Georgia}.dark{fill:#5b192c}.gold{fill:#d6a72f}.muted{fill:#65736f}.white{fill:#fff}text{font-kerning:normal}</style></defs>
<rect width="794" height="1123" fill="#faf7f0"/><image xlink:href="lovely-hero.jpg" x="0" y="0" width="794" height="344" preserveAspectRatio="xMidYMid slice"/><rect width="794" height="344" fill="url(#shade)"/>
<text id="hero-brand" x="49" y="49" class="serif white" font-size="22">Pharmapele</text><text id="hero-category" x="49" y="89" class="sans" font-size="8" font-weight="700" letter-spacing="2.2" fill="#f3aec5">DEO HAIR AND BODY SPLASH</text><text id="hero-title" x="49" y="140" class="sans" font-size="58" font-weight="300" letter-spacing="-3.5" fill="#f5d77e">LOVELY</text><text id="hero-tagline" x="49" y="175" class="sans white" font-size="9" font-weight="700" letter-spacing="3">DELICADA &amp; MEMORÁVEL</text><text id="hero-paragraph" data-edit-box="hero-paragraph" x="49" y="213" class="serif white" font-size="16" font-style="italic"><tspan x="49">Um encontro entre delicadeza e desejo.</tspan><tspan x="49" dy="22">LOVELY envolve os sentidos com uma</tspan><tspan x="49" dy="22">presença feminina, luminosa e impossível</tspan><tspan x="49" dy="22">de esquecer.</tspan></text>
<rect y="344" width="265" height="699" fill="#fbe7ee"/><rect x="265" y="344" width="529" height="699" fill="url(#paper)"/><circle cx="133" cy="563" r="130" fill="#f3aec5"/><text x="44" y="738" transform="rotate(-90 44 738)" class="sans dark" font-size="58" font-weight="700" opacity=".07">LOVELY</text><image xlink:href="lovely-produto.png" x="66" y="375" width="125" height="570" preserveAspectRatio="xMidYMid meet"/><line x1="40" y1="934" x2="226" y2="934" stroke="#5b192c" stroke-opacity=".3"/><text x="40" y="967" class="sans dark" font-size="18" font-weight="700" letter-spacing="4">150 ml</text><text x="40" y="991" class="sans muted" font-size="8" letter-spacing="1.4">PARA CORPO E CABELO</text>
<text x="299" y="386" class="sans gold" font-size="9" font-weight="700" letter-spacing="2">ENCANTO EM CADA GESTO</text><text id="opening-title" data-edit-box="opening-title" x="299" y="420" class="serif dark" font-size="27"><tspan x="299">Uma fragrância delicada, feita</tspan><tspan x="299" dy="29">para ser lembrada.</tspan></text><text id="opening-paragraph" data-edit-box="opening-paragraph" x="299" y="476" class="sans muted" font-size="11"><tspan x="299">Feminina e irresistível, combina frutas luminosas, flores envolventes e</tspan><tspan x="299" dy="15">um fundo macio que permanece na memória.</tspan></text>
<g><rect x="299" y="506" width="145" height="120" fill="#fff"/><rect x="455" y="506" width="145" height="120" fill="#fff"/><rect x="611" y="506" width="145" height="120" fill="#fff"/><text x="313" y="531" class="serif gold" font-size="17" font-style="italic">01</text><text x="313" y="556" class="sans dark" font-size="9.5" font-weight="700">CORPO + CABELO</text><text id="benefit-01-body" data-edit-box="benefit-01-body" x="313" y="578" class="sans muted" font-size="9"><tspan x="313">Perfumação delicada em dois</tspan><tspan x="313" dy="13">gestos de autocuidado.</tspan></text><text x="469" y="531" class="serif gold" font-size="17" font-style="italic">02</text><text x="469" y="556" class="sans dark" font-size="9.5" font-weight="700">FEMININA</text><text id="benefit-02-body" data-edit-box="benefit-02-body" x="469" y="578" class="sans muted" font-size="9"><tspan x="469">Uma presença envolvente para</tspan><tspan x="469" dy="13">diferentes ocasiões.</tspan></text><text x="625" y="531" class="serif gold" font-size="17" font-style="italic">03</text><text x="625" y="556" class="sans dark" font-size="9.5" font-weight="700">SENSORIAL</text><text id="benefit-03-body" data-edit-box="benefit-03-body" x="625" y="578" class="sans muted" font-size="9"><tspan x="625">Frutada, floral e macia,</tspan><tspan x="625" dy="13">com fundo memorável.</tspan></text></g>
<text x="299" y="659" class="sans gold" font-size="9" font-weight="700" letter-spacing="2">UNIVERSO OLFATIVO</text><text x="756" y="659" text-anchor="end" class="serif dark" font-size="18">Notas em destaque</text><g><rect x="299" y="676" width="109" height="55" fill="#f3aec5"/><text id="note-1" data-edit-box="note-1" x="353" y="699" text-anchor="middle" class="sans dark"><tspan font-size="8.5" font-weight="700">Pitaia</tspan><tspan x="353" dy="16" class="serif" font-size="8" font-style="italic">luminosa</tspan></text><rect x="415" y="676" width="109" height="55" fill="#5b192c"/><text id="note-2" data-edit-box="note-2" x="469" y="699" text-anchor="middle" class="sans white"><tspan font-size="8.5" font-weight="700">Peônia vermelha</tspan><tspan x="469" dy="16" class="serif" font-size="8" font-style="italic">envolvente</tspan></text><rect x="531" y="676" width="109" height="55" fill="#f3aec5"/><text id="note-3" data-edit-box="note-3" x="585" y="699" text-anchor="middle" class="sans dark"><tspan font-size="8.5" font-weight="700">Flor de laranjeira</tspan><tspan x="585" dy="16" class="serif" font-size="8" font-style="italic">delicada</tspan></text><rect x="647" y="676" width="109" height="55" fill="#5b192c"/><text id="note-4" data-edit-box="note-4" x="701" y="699" text-anchor="middle" class="sans white"><tspan font-size="8.5" font-weight="700">Almíscar branco</tspan><tspan x="701" dy="16" class="serif" font-size="8" font-style="italic">macio</tspan></text></g>
<rect x="299" y="760" width="457" height="108" fill="#f0eadc"/><text x="315" y="785" class="sans gold" font-size="9" font-weight="700" letter-spacing="1.7">RITUAL LOVELY</text><text id="ritual-title" data-edit-box="ritual-title" x="315" y="811" class="serif dark" font-size="18"><tspan x="315">Perfume do seu</tspan><tspan x="315" dy="20">jeito</tspan></text><text id="ritual-01" data-edit-box="ritual-01" x="463" y="785" class="sans dark"><tspan class="serif gold" font-size="15" font-style="italic">01</tspan><tspan x="463" dy="20" font-size="8.5" font-weight="700">NO CORPO</tspan><tspan x="463" dy="16" font-size="8" fill="#65736f">Borrife nos pontos</tspan><tspan x="463" dy="12" font-size="8" fill="#65736f">desejados.</tspan></text><text id="ritual-02" data-edit-box="ritual-02" x="559" y="785" class="sans dark"><tspan class="serif gold" font-size="15" font-style="italic">02</tspan><tspan x="559" dy="20" font-size="8.5" font-weight="700">NOS CABELOS</tspan><tspan x="559" dy="16" font-size="8" fill="#65736f">Aplique suavemente</tspan><tspan x="559" dy="12" font-size="8" fill="#65736f">sobre os fios.</tspan></text><text id="ritual-03" data-edit-box="ritual-03" x="657" y="785" class="sans dark"><tspan class="serif gold" font-size="15" font-style="italic">03</tspan><tspan x="657" dy="20" font-size="8.5" font-weight="700">NA ROTINA</tspan><tspan x="657" dy="16" font-size="8" fill="#65736f">Renove sempre que</tspan><tspan x="657" dy="12" font-size="8" fill="#65736f">desejar.</tspan></text>
<rect x="299" y="895" width="457" height="112" fill="#5b192c"/><text x="317" y="922" class="sans" font-size="8" font-weight="700" letter-spacing="1.7" fill="#f3aec5">A SENSAÇÃO LOVELY</text><text id="signature-title" data-edit-box="signature-title" x="317" y="949" class="serif white" font-size="18"><tspan x="317">Delicadeza, desejo</tspan><tspan x="317" dy="20">e memória.</tspan></text><text id="signature-paragraph" data-edit-box="signature-paragraph" x="493" y="929" class="sans" font-size="9" fill="#eef3eb"><tspan x="493">A pitaia abre a fragrância com brilho e encontra a feminilidade da</tspan><tspan x="493" dy="14">peônia vermelha e da flor de laranjeira. Íris, almíscar branco e</tspan><tspan x="493" dy="14">âmbar criam um fundo macio, elegante e inesquecível.</tspan></text>
<rect y="1043" width="794" height="80" fill="#005095"/><text x="49" y="1092" class="serif white" font-size="24">Pharmapele</text><text x="745" y="1092" text-anchor="end" class="sans white" font-size="8" font-weight="700" letter-spacing="2">LOVELY · DELICADA &amp; MEMORÁVEL</text></svg>