<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 794 1123">
<title>Lâmina de varejo GLOW — A4</title><defs><linearGradient id="shade"><stop stop-color="#8b301a" stop-opacity=".97"/><stop offset=".48" stop-color="#8b301a" stop-opacity=".78"/><stop offset="1" stop-color="#8b301a" stop-opacity=".08"/></linearGradient><linearGradient id="paper"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f6f1e7"/></linearGradient><style>.sans{font-family:Arial}.serif{font-family:Georgia}.dark{fill:#8b301a}.gold{fill:#d6a72f}.muted{fill:#65736f}.white{fill:#fff}text{font-kerning:normal}</style></defs>
<rect width="794" height="1123" fill="#faf7f0"/><image xlink:href="glow-hero.jpg" x="0" y="0" width="794" height="344" preserveAspectRatio="xMidYMid slice"/><rect width="794" height="344" fill="url(#shade)"/>
<text id="hero-brand" x="49" y="49" class="serif white" font-size="22">Pharmapele</text><text id="hero-category" x="49" y="89" class="sans" font-size="8" font-weight="700" letter-spacing="2.2" fill="#ffc18c">DEO HAIR AND BODY SPLASH</text><text id="hero-title" x="49" y="140" class="sans" font-size="58" font-weight="300" letter-spacing="-3.5" fill="#f5d77e">GLOW</text><text id="hero-tagline" x="49" y="175" class="sans white" font-size="9" font-weight="700" letter-spacing="3">ALEGRE &amp; RADIANTE</text><text id="hero-paragraph" data-edit-box="hero-paragraph" x="49" y="213" class="serif white" font-size="16" font-style="italic"><tspan x="49">Energia que aparece de dentro para</tspan><tspan x="49" dy="22">fora. GLOW traduz leveza, alegria e</tspan><tspan x="49" dy="22">uma luminosidade espontânea em uma</tspan><tspan x="49" dy="22">fragrância cheia de vida.</tspan></text>
<rect y="344" width="265" height="699" fill="#fff0df"/><rect x="265" y="344" width="529" height="699" fill="url(#paper)"/><circle cx="133" cy="563" r="130" fill="#ffc18c"/><text x="44" y="738" transform="rotate(-90 44 738)" class="sans dark" font-size="58" font-weight="700" opacity=".07">GLOW</text><image xlink:href="glow-produto.png" x="66" y="375" width="125" height="570" preserveAspectRatio="xMidYMid meet"/><line x1="40" y1="934" x2="226" y2="934" stroke="#8b301a" stroke-opacity=".3"/><text x="40" y="967" class="sans dark" font-size="18" font-weight="700" letter-spacing="4">150 ml</text><text x="40" y="991" class="sans muted" font-size="8" letter-spacing="1.4">PARA CORPO E CABELO</text>
<text x="299" y="386" class="sans gold" font-size="9" font-weight="700" letter-spacing="2">LUZ EM MOVIMENTO</text><text id="opening-title" data-edit-box="opening-title" x="299" y="420" class="serif dark" font-size="27"><tspan x="299">Uma fragrância para iluminar</tspan><tspan x="299" dy="29">a rotina.</tspan></text><text id="opening-paragraph" data-edit-box="opening-paragraph" x="299" y="476" class="sans muted" font-size="11"><tspan x="299">Espontânea e luminosa, combina frescor frutado, flores solares e um fundo</tspan><tspan x="299" dy="15">aconchegante para acompanhar dias leves.</tspan></text>
<g><rect x="299" y="506" width="145" height="120" fill="#fff"/><rect x="455" y="506" width="145" height="120" fill="#fff"/><rect x="611" y="506" width="145" height="120" fill="#fff"/><text x="313" y="531" class="serif gold" font-size="17" font-style="italic">01</text><text x="313" y="556" class="sans dark" font-size="9.5" font-weight="700">CORPO + CABELO</text><text id="benefit-01-body" data-edit-box="benefit-01-body" x="313" y="578" class="sans muted" font-size="9"><tspan x="313">Um gesto prático de perfume</tspan><tspan x="313" dy="13">e luminosidade.</tspan></text><text x="469" y="531" class="serif gold" font-size="17" font-style="italic">02</text><text x="469" y="556" class="sans dark" font-size="9.5" font-weight="700">LEVE E ALEGRE</text><text id="benefit-02-body" data-edit-box="benefit-02-body" x="469" y="578" class="sans muted" font-size="9"><tspan x="469">Perfeita para renovar o</tspan><tspan x="469" dy="13">astral ao longo do dia.</tspan></text><text x="625" y="531" class="serif gold" font-size="17" font-style="italic">03</text><text x="625" y="556" class="sans dark" font-size="9.5" font-weight="700">SENSORIAL</text><text id="benefit-03-body" data-edit-box="benefit-03-body" x="625" y="578" class="sans muted" font-size="9"><tspan x="625">Frutada, floral e macia,</tspan><tspan x="625" dy="13">com calor aconchegante.</tspan></text></g>
<text x="299" y="659" class="sans gold" font-size="9" font-weight="700" letter-spacing="2">UNIVERSO OLFATIVO</text><text x="756" y="659" text-anchor="end" class="serif dark" font-size="18">Notas em destaque</text><g><rect x="299" y="676" width="109" height="55" fill="#ffc18c"/><text id="note-1" data-edit-box="note-1" x="353" y="699" text-anchor="middle" class="sans dark"><tspan font-size="8.5" font-weight="700">Amora-ártica</tspan><tspan x="353" dy="16" class="serif" font-size="8" font-style="italic">vibrante</tspan></text><rect x="415" y="676" width="109" height="55" fill="#8b301a"/><text id="note-2" data-edit-box="note-2" x="469" y="699" text-anchor="middle" class="sans white"><tspan font-size="8.5" font-weight="700">Margarida</tspan><tspan x="469" dy="16" class="serif" font-size="8" font-style="italic">solar</tspan></text><rect x="531" y="676" width="109" height="55" fill="#ffc18c"/><text id="note-3" data-edit-box="note-3" x="585" y="699" text-anchor="middle" class="sans dark"><tspan font-size="8.5" font-weight="700">Cashmere</tspan><tspan x="585" dy="16" class="serif" font-size="8" font-style="italic">aconchegante</tspan></text><rect x="647" y="676" width="109" height="55" fill="#8b301a"/><text id="note-4" data-edit-box="note-4" x="701" y="699" text-anchor="middle" class="sans white"><tspan font-size="8.5" font-weight="700">Madeiras</tspan><tspan x="701" dy="16" class="serif" font-size="8" font-style="italic">macias</tspan></text></g>
<rect x="299" y="760" width="457" height="108" fill="#f0eadc"/><text x="315" y="785" class="sans gold" font-size="9" font-weight="700" letter-spacing="1.7">RITUAL GLOW</text><text id="ritual-title" data-edit-box="ritual-title" x="315" y="811" class="serif dark" font-size="18"><tspan x="315">Perfume do seu</tspan><tspan x="315" dy="20">jeito</tspan></text><text id="ritual-01" data-edit-box="ritual-01" x="463" y="785" class="sans dark"><tspan class="serif gold" font-size="15" font-style="italic">01</tspan><tspan x="463" dy="20" font-size="8.5" font-weight="700">NO CORPO</tspan><tspan x="463" dy="16" font-size="8" fill="#65736f">Borrife nos pontos</tspan><tspan x="463" dy="12" font-size="8" fill="#65736f">desejados.</tspan></text><text id="ritual-02" data-edit-box="ritual-02" x="559" y="785" class="sans dark"><tspan class="serif gold" font-size="15" font-style="italic">02</tspan><tspan x="559" dy="20" font-size="8.5" font-weight="700">NOS CABELOS</tspan><tspan x="559" dy="16" font-size="8" fill="#65736f">Aplique suavemente</tspan><tspan x="559" dy="12" font-size="8" fill="#65736f">sobre os fios.</tspan></text><text id="ritual-03" data-edit-box="ritual-03" x="657" y="785" class="sans dark"><tspan class="serif gold" font-size="15" font-style="italic">03</tspan><tspan x="657" dy="20" font-size="8.5" font-weight="700">NA ROTINA</tspan><tspan x="657" dy="16" font-size="8" fill="#65736f">Renove sempre que</tspan><tspan x="657" dy="12" font-size="8" fill="#65736f">desejar.</tspan></text>
<rect x="299" y="895" width="457" height="112" fill="#8b301a"/><text x="317" y="922" class="sans" font-size="8" font-weight="700" letter-spacing="1.7" fill="#ffc18c">A SENSAÇÃO GLOW</text><text id="signature-title" data-edit-box="signature-title" x="317" y="949" class="serif white" font-size="18"><tspan x="317">Alegria, luz</tspan><tspan x="317" dy="20">e espontaneidade.</tspan></text><text id="signature-paragraph" data-edit-box="signature-paragraph" x="493" y="929" class="sans" font-size="9" fill="#eef3eb"><tspan x="493">A vivacidade da amora-ártica encontra a delicadeza luminosa da</tspan><tspan x="493" dy="14">margarida. O cashmere e as madeiras macias envolvem a pele</tspan><tspan x="493" dy="14">com conforto, leveza e uma presença radiante.</tspan></text>
<rect y="1043" width="794" height="80" fill="#005095"/><text x="49" y="1092" class="serif white" font-size="24">Pharmapele</text><text x="745" y="1092" text-anchor="end" class="sans white" font-size="8" font-weight="700" letter-spacing="2">GLOW · ALEGRE &amp; RADIANTE</text></svg>